name: Regression Test for ion-core on Ubuntu using CMake

on:
  pull_request:
    branches:
    - integration

  workflow_dispatch:

#  push:
#    branches:
#      - update-4.1.3a-symlink
#      - update-4.1.3s-add-os-support

jobs:
  build-and-test:
    runs-on: ubuntu-latest  # Use Ubuntu. Or macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true  # Initialize direct submodules only (non-recursive)

      - name: Set up dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bash python3 gcc make cmake # Install dependencies

      - name: Generate timestamp for file names
        id: timestamp
        run: echo "TIMESTAMP=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_ENV

      - name: Setup ION-DTN submodule
        run: |
          ./scripts/setup-submodule.sh 

      - name: Run build and tests, capture stdout
        run: | # Redirect stdout and stderr to a log
          # -e aborts on the first failing command; pipefail makes the exit code
          # propagate through the `| tee` below so build/test failures fail the step
          # instead of being masked by tee's exit 0.
          set -eo pipefail
          {
            echo "Starting build and tests at $(date)"
            rm -rf build
            mkdir build
            cd build
            cmake ..
            make
            make man
            sudo make install
            sudo ldconfig
            make test
          } 2>&1 | tee $GITHUB_WORKSPACE/build-and-test.log

      - name: Display Progress
        if: ${{ always() }}  # Display progress even if tests were interrupted
        run: |
          if [ -f ./external/ION-DTN/tests/progress ]; then
            echo "=== Test Progress ==="
            cat ./external/ION-DTN/tests/progress
          else
            echo "Progress file not found at ./external/ION-DTN/tests/progress"
            echo "Checking if tests directory exists:"
            ls -la ./external/ION-DTN/tests/ || echo "Tests directory not found"
          fi

      - name: Upload full build and test log
        if: ${{ always() }}  # Capture log even if the previous step fails
        uses: actions/upload-artifact@v4
        with:
          name: build-and-test-log-cmake${{ env.TIMESTAMP }}
          path: build-and-test.log  # Upload the entire stdout and stderr as an artifact

      - name: Upload progress file as artifact
        if: ${{ always() }}  # Capture progress even if the previous step fails
        uses: actions/upload-artifact@v4
        with:
          name: test-progress-cmake${{ env.TIMESTAMP }}
          path: ./external/ION-DTN/tests/progress  # Upload the 'progress' file for later review
          if-no-files-found: warn  # Don't fail if progress file doesn't exist
